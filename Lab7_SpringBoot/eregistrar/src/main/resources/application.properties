spring.application.name=eregistrar
server.port=8081

# Spring Boot DevTools: automatic restart and LiveReload during development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Do not cache templates in development, so edits show on refresh
spring.thymeleaf.cache=false

# File-backed H2 database so data survives across restarts.
# No credentials are secret here: H2 with this username/password is the
# framework's own local-development default, not a real deployment secret.
spring.datasource.url=jdbc:h2:file:./data/eregistrar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
