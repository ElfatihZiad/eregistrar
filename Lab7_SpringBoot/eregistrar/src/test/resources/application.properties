spring.application.name=eregistrar-test

# In-memory database for tests, isolated from the file-backed dev database.
spring.datasource.url=jdbc:h2:mem:eregistrar-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=false
